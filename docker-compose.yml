services:
  traefik:
    image: traefik:v3.3
    container_name: termi-traefik
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:22080"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      # Keep WebSocket connections alive (SSH/RDP sessions can be long-lived)
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=0"
    ports:
      - "${WEB_PORT:-22080}:22080"
    environment:
      # --- Same-domain mode: set GATEWAY_PREFIX (e.g. /gateway), leave GATEWAY_DOMAIN empty
      # --- Separate-domain mode: set GATEWAY_DOMAIN (e.g. gateway.example.com), leave GATEWAY_PREFIX empty
      GATEWAY_PREFIX: ${GATEWAY_PREFIX:-}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
    volumes:
      - ./traefik:/etc/traefik:ro
    networks:
      - edge
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: termi-guacd
    restart: unless-stopped
    networks:
      - remote
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g

  postgres:
    image: postgres:17-alpine
    container_name: termi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-termi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-termi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/web/compose.Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: termi-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-termi}
    command: ["sh", "-c", "cd apps/web && npx prisma migrate deploy"]
    networks:
      - data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: apps/web/compose.Dockerfile
      args:
        # NEXT_PUBLIC_GATEWAY_URL is intentionally excluded — it is a runtime env var only,
        # served to the browser via the token API. This keeps the image deployment-agnostic.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}

    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

    container_name: termi-web
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:22080}
      # Returned by the token API to the browser at runtime — determines which URL the
      # browser uses to open the WebSocket. Set to match your deployment:
      #   Same domain:      ws://example.com/gateway   (with GATEWAY_PREFIX=/gateway in Traefik)
      #   Separate domain:  wss://gateway.example.com  (with GATEWAY_DOMAIN=gateway.example.com)
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-termi}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      # Internal Docker network URL — web server talks directly to gateway, bypasses Traefik
      GATEWAY_URL: ws://gateway:22081
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-}
      WEB_PORT: ${WEB_PORT:-22080}
      GATEWAY_PORT: ${GATEWAY_PORT:-22081}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      # Search engines: SEARCH_INDEXING=off keeps a private instance out of search
      # results; the verification tokens prove ownership in Google / Bing consoles.
      SEARCH_INDEXING: ${SEARCH_INDEXING:-}
      # AI assistant for everyone (optional); users can also add their own key.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/compose.Dockerfile
    container_name: termi-gateway
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:22080}
      GATEWAY_PORT: 22081
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET must be set (openssl rand -base64 32)}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      # Close a terminal after this long with no output or typing (tab open or not),
      # and any terminal after this many days. 0 days = no age limit.
      GATEWAY_IDLE_TTL_HOURS: ${GATEWAY_IDLE_TTL_HOURS:-8}
      GATEWAY_MAX_SESSION_DAYS: ${GATEWAY_MAX_SESSION_DAYS:-7}
      # Every GATEWAY_ACCESS_CHECK_SEC the gateway asks the web app whether each open
      # connection is still allowed, and closes those whose sign-in was revoked or
      # whose server access was removed. 0 turns this off.
      WEB_INTERNAL_URL: http://web:22080
      GATEWAY_ACCESS_CHECK_SEC: ${GATEWAY_ACCESS_CHECK_SEC:-30}
      # Uncomment to allow RDP/VNC through a jump host (guacd reaches the relay here).
      # GUACD_TUNNEL_HOST: gateway
      NODE_ENV: production
    networks:
      - edge
      - remote
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 1g

volumes:
  postgres-data:

networks:
  # Public side: the reverse proxy, web app and gateway. Outbound internet is
  # needed here (SSH targets, SMTP, webhooks).
  edge:
    driver: bridge
  # Database: internal (no internet), and only the web app and migrations join
  # it — the gateway, which dials user-supplied hosts, can't reach Postgres.
  data:
    driver: bridge
    internal: true
  # Remote desktops: guacd and the gateway only. guacd dials RDP/VNC targets.
  remote:
    driver: bridge
