<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Termix</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0f172a;
                color: #e2e8f0;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .wrap {
                padding: 2rem;
            }
            .spinner {
                width: 28px;
                height: 28px;
                margin: 0 auto 1rem;
                border: 3px solid rgba(148, 163, 184, 0.3);
                border-top-color: #38bdf8;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <!--
            Fallback page only. The native shell loads the hosted Termix app
            (server.url in capacitor.config.ts). This shows briefly on launch or
            if the server is unreachable.
        -->
        <div class="wrap">
            <div class="spinner"></div>
            <p>Connecting to Termix…</p>
        </div>
    </body>
</html>
