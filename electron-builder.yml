appId: com.shuvo.termi
productName: Termi
directories:
  output: dist

# Auto-update metadata (latest*.yml) and installers are published to GitHub
# Releases; installed apps read those files to self-update.
publish:
  provider: github
  owner: shuvoooo
  repo: termi
  # release.yml publishes a (non-draft) release for the same tag. electron-builder
  # defaults to releaseType: draft and will SKIP every upload if the existing
  # release is already published — so match it explicitly.
  releaseType: release

# Only the Electron entry points go into the asar. The desktop app is a thin
# native shell around the hosted Termi server (web + gateway + guacd all live
# there); the only local capability is the terminal, which uses node-pty.
# NOTE: main.js requires ./updater at startup — omitting it crashes the app.
files:
  - apps/electron/main.js
  - apps/electron/preload.js
  - apps/electron/updater.js
  - apps/electron/build-config.json
  - apps/web/public/icons/icon-512x512.png
  - node_modules/node-pty/**/*

# Native addons cannot be loaded from inside an asar archive — unpack them.
asarUnpack:
  - node_modules/node-pty/**/*

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # Squirrel.Mac updates from a zip, not a dmg — required for latest-mac.yml
    # to describe a usable update (see the notarize note below).
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: apps/web/public/icons/icon-512x512.png
  # Hardened runtime is required for notarization and for macOS to trust the
  # app as a WebAuthn/passkey client (Touch ID access).
  hardenedRuntime: true
  # Suppress local Gatekeeper check — notarization handles this post-build.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization requires a paid Apple Developer ID, which this project does not
  # have. The DMG is therefore ad-hoc signed but NOT notarized, so macOS shows a
  # Gatekeeper warning on first launch. Users bypass it with right-click → Open
  # or `xattr -dr com.apple.quarantine /Applications/Termi.app` (see README).
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: apps/web/public/icons/icon-512x512.png

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: apps/web/public/icons/icon-512x512.png
