appId: com.shuvo.termi
productName: Termi
directories:
  output: dist

# Only the Electron entry points go into the asar.
# The bundled gateway is placed as an extraResource so it can be spawned
# as a child process (asar-packed files cannot be spawned directly).
files:
  - apps/electron/main.js
  - apps/electron/preload.js
  - apps/electron/setup-preload.js
  - apps/electron/setup.html
  - apps/web/public/icons/icon-512x512.png
  - node_modules/node-pty/**/*
  - node_modules/ssh2/**/*

# Native addons cannot be loaded from inside an asar archive — unpack them.
# The gateway child process also uses these via NODE_PATH pointing here.
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/ssh2/**/*

extraResources:
  # Gateway bundled to CJS by the build:gateway-bundle script
  - from: apps/electron/gateway.cjs
    to: gateway.cjs

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: apps/web/public/icons/icon-512x512.png
  # Hardened runtime is required for notarization and for macOS to trust the
  # app as a WebAuthn/passkey client (Touch ID access).
  hardenedRuntime: true
  # Suppress local Gatekeeper check — notarization handles this post-build.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization requires a paid Apple Developer ID, which this project does not
  # have. The DMG is therefore ad-hoc signed but NOT notarized, so macOS shows a
  # Gatekeeper warning on first launch. Users bypass it with right-click → Open
  # or `xattr -dr com.apple.quarantine /Applications/Termi.app` (see README).
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: apps/web/public/icons/icon-512x512.png

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
  icon: apps/web/public/icons/icon-512x512.png
