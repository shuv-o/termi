appId: run.termi
productName: Termi
directories:
    output: dist

# Auto-update metadata (latest*.yml) and installers are published to GitHub
# Releases; installed apps read those files to self-update.
publish:
    provider: github
    owner: shuv-o
    repo: termi
    # release.yml publishes a (non-draft) release for the same tag. electron-builder
    # defaults to releaseType: draft and will SKIP every upload if the existing
    # release is already published — so match it explicitly.
    releaseType: release

# Only the Electron entry points go into the asar. The desktop app is a thin
# native shell around the hosted Termi server (web + gateway + guacd all live
# there); the only local capability is the terminal, which uses node-pty.
# NOTE: this list is an explicit whitelist. Every local module main.js requires
# at startup (./updater, ./window-state, ./context-menu) must appear below, or
# the packaged app crashes on launch with "Cannot find module".
files:
    - apps/electron/main.js
    - apps/electron/preload.js
    - apps/electron/updater.js
    - apps/electron/window-state.js
    - apps/electron/context-menu.js
    - apps/electron/tunnel-mux.js
    - apps/electron/local-gateway.js
    - apps/electron/gateway/index.mjs
    - apps/electron/build-config.json
    - apps/web/public/icons/icon-512x512.png
    - node_modules/node-pty/**/*

# Electron fuses: flipped in the binary at package time, so a copy of the app
# can't be repurposed as a general Node runtime that carries the user's
# session cookies (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect), and only the
# integrity-checked app.asar can be loaded. Cookies are encrypted at rest with
# the OS keychain. Nothing in apps/electron forks Electron as Node.
electronFuses:
    runAsNode: false
    enableCookieEncryption: true
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
    loadBrowserProcessSpecificV8Snapshot: false
    grantFileProtocolExtraPrivileges: false
    # Flipping fuses invalidates the ad-hoc macOS signature; re-sign ad hoc.
    resetAdHocDarwinSignature: true

# Native addons cannot be loaded from inside an asar archive — unpack them.
asarUnpack:
    - node_modules/node-pty/**/*

mac:
    # DMGs only. macOS builds are ad-hoc signed, not notarized, so they can't
    # self-update: the app checks GitHub's API for a newer release and sends
    # the user to the download page (apps/electron/updater.js). No zip or
    # blockmaps; CI writes a latest-mac.yml separately for apps up to 1.2.0,
    # which still look for it (scripts/write-mac-update-info.mjs).
    target:
        - target: dmg
          arch: [x64, arm64]
    category: public.app-category.developer-tools
    icon: apps/web/public/icons/icon-512x512.png
    # Hardened runtime is required for notarization and for the native passkey
    # bridge — but both of those already need a real Developer ID, which this
    # project does not have (notarize: false below, ad-hoc signing in CI), so
    # macOS passkeys already fall back to password today.
    #
    # Keeping it true actively breaks the build: it makes electron-builder pass
    # `--timestamp` to `codesign --sign -`, and ad-hoc signatures cannot be
    # timestamped. The arm64 target signs every nested binary, so it reliably
    # times out against Apple's timestamp server. Re-enable this together with
    # real signing, not before.
    hardenedRuntime: false
    # Suppress local Gatekeeper check — notarization handles this post-build.
    gatekeeperAssess: false
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    # Notarization requires a paid Apple Developer ID, which this project does not
    # have. The DMG is therefore ad-hoc signed but NOT notarized, so macOS shows a
    # Gatekeeper warning on first launch. Users bypass it with right-click → Open
    # or `xattr -dr com.apple.quarantine /Applications/Termi.app` (see README).
    notarize: false

win:
    # One installer for both architectures: it installs the right build for
    # the machine. electron-updater's latest.yml can't choose by architecture
    # on Windows, so separate installers would break auto-update for one.
    target:
        - target: nsis
          arch: [x64, arm64]
    icon: apps/web/public/icons/icon-512x512.png

linux:
    target:
        - target: AppImage
          arch: [x64, arm64]
    icon: apps/web/public/icons/icon-512x512.png

# Updates download the whole installer; no .blockmap files are published.
nsis:
    differentialPackage: false
dmg:
    writeUpdateInfo: false
