appId: com.shuvo.termi
productName: Termi
directories:
  output: dist

# Only the Electron entry points go into the asar.
# The Next.js standalone server and bundled gateway are placed as extraResources
# so they can be spawned as child processes (asar-packed files cannot be spawned).
files:
  - apps/electron/main.js
  - apps/electron/preload.js
  - node_modules/node-pty/**/*

# node-pty ships a native addon (.node file) that cannot be loaded from inside
# an asar archive — unpack it to the filesystem alongside the asar.
asarUnpack:
  - node_modules/node-pty/**/*

extraResources:
  # Next.js standalone output — already contains public/ and .next/static/
  - from: apps/web/.next/standalone
    to: web-standalone
  # Gateway bundled to CJS by the build:gateway-bundle script
  - from: apps/electron/gateway.cjs
    to: gateway.cjs

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Hardened runtime is required for notarization and for macOS to trust the
  # app as a WebAuthn/passkey client (Touch ID access).
  hardenedRuntime: true
  # Suppress local Gatekeeper check — notarization handles this post-build.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarize after signing. Reads APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # and APPLE_TEAM_ID from environment variables.
  notarize: true

win:
  target: nsis
  icon: build/icon.ico

linux:
  target: AppImage
  icon: build/icon.png
