name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: CI only ever reads the repo.
permissions:
  contents: read

# Job `name:`s below are used as required status checks — renaming one
# silently un-requires it. Change them together with the branch protection.
jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # root package.json, package-lock.json, and apps/gateway/package.json
      # must all move together — they drifted silently once before (gateway
      # stayed on 1.0.8 through the 1.0.9 release). Fail fast instead of
      # relying on someone noticing during the release process.
      - name: Check package.json versions are in sync
        run: |
          ROOT=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          GATEWAY=$(node -p "require('./apps/gateway/package.json').version")

          echo "root package.json:      $ROOT"
          echo "package-lock.json:      $LOCK"
          echo "gateway package.json:   $GATEWAY"

          if [ "$ROOT" != "$LOCK" ] || [ "$ROOT" != "$GATEWAY" ]; then
            echo "::error::Version mismatch — root ($ROOT), package-lock.json ($LOCK), and apps/gateway/package.json ($GATEWAY) must all match."
            exit 1
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Fails on high/critical advisories in production dependencies only.
      # npm audit reads package-lock.json, so no install is needed. Reviewed
      # exceptions live in the ALLOWLIST inside the script, each with a reason.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: gateway
            context: .
            dockerfile: apps/gateway/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build-only sanity check for the images published by docker-release.yml
      # on release tags — catches a broken Dockerfile on every PR instead of
      # only when a version tag is pushed (see CHANGELOG v1.0.12).
      - name: Build termi-${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
