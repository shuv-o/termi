name: Build Desktop Apps

# Builds the Electron desktop shell for macOS, Windows and Linux and publishes
# the installers + auto-update metadata (latest*.yml) to the GitHub Release for
# the pushed tag. Installed apps read those files to self-update.
#
# Trigger: push a version tag, e.g.
#   npm version 1.0.1 --no-git-tag-version   # bump package.json
#   git commit -am "release: v1.0.1" && git tag v1.0.1 && git push --tags
#
# The tag (v1.0.1) MUST match the version in package.json, or electron-updater
# won't recognise the release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & publish desktop app
        run: npm run publish:electron
        env:
          # electron-builder uploads artifacts to the GitHub Release via this token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMI_REMOTE_URL: ${{ vars.TERMI_REMOTE_URL }}

          # --- macOS code signing ---
          # This project has no Apple Developer ID (electron-builder.yml sets
          # notarize: false), so the mac app is ad-hoc signed. Disable identity
          # auto-discovery to keep that deterministic on CI.
          #
          # Do NOT add `CSC_LINK: ${{ secrets.CSC_LINK }}` here while the secret
          # is unset: an undefined secret renders as an empty string, and
          # electron-builder then treats "" as a certificate path and dies with
          # "<repo dir> not a file". To enable real signing, add the secrets AND
          # the CSC_LINK/CSC_KEY_PASSWORD env lines together, and flip
          # notarize: true (plus APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          # APPLE_TEAM_ID) — both are required before mac apps can self-update.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
