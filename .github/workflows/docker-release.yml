name: Docker Release

# Builds and publishes the termi-web and termi-gateway images to both Docker Hub
# and GitHub Container Registry (ghcr.io) whenever a version tag is pushed.
#
# Trigger: push a version tag, e.g.
#   npm version 1.0.1 --no-git-tag-version   # bump package.json
#   git commit -am "release: v1.0.1" && git tag v1.0.1 && git push --tags
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username (shuvoo)
#   DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings > Security >
#                         New Access Token), not your account password.
# GHCR needs no secrets: it authenticates with the automatically-provided
# GITHUB_TOKEN via the `packages: write` permission below.
#
# Note: apps/web/Dockerfile and apps/gateway/Dockerfile are the standalone,
# single-app-context Dockerfiles (see CLAUDE.md) - distinct from
# compose.Dockerfile, which builds from the full monorepo for docker-compose.
# NEXT_PUBLIC_* build args are intentionally left unset here so the published
# images stay deployment-agnostic; self-hosters who need custom values should
# build locally via docker-compose as documented in README.md.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & push termi-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - image: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shuvoo/termi-${{ matrix.image }}:latest
            shuvoo/termi-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/shuv-o/termi-${{ matrix.image }}:latest
            ghcr.io/shuv-o/termi-${{ matrix.image }}:${{ steps.version.outputs.version }}
