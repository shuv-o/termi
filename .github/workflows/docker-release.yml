name: Docker Release

# Builds and publishes the termi-web and termi-gateway images to both Docker Hub
# and GitHub Container Registry (ghcr.io) whenever a version tag is pushed.
#
# Trigger: push a version tag, e.g.
#   npm version 1.0.1 --no-git-tag-version   # bump package.json
#   git commit -am "release: v1.0.1" && git tag v1.0.1 && git push --tags
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username (shuvoo)
#   DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings > Security >
#                         New Access Token), not your account password.
# GHCR needs no secrets: it authenticates with the automatically-provided
# GITHUB_TOKEN via the `packages: write` permission below.
#
# Supply chain: every image is pushed with a BuildKit SBOM and max-mode SLSA
# provenance attestation, then signed keyless with cosign (Sigstore, GitHub
# OIDC identity — no long-lived signing key) by digest in both registries.
# Verify with e.g.:
#   cosign verify ghcr.io/shuv-o/termi-web:<version> \
#     --certificate-identity-regexp '^https://github.com/shuv-o/termi/\.github/workflows/docker-release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Note: apps/web/Dockerfile and apps/gateway/Dockerfile build with their own
# app folder as context (no lockfile there, so npm resolves versions at build
# time) - distinct from compose.Dockerfile, which docker-compose uses for local
# builds from the repo root.
# NEXT_PUBLIC_* build args are intentionally left unset here so the published
# images stay deployment-agnostic; self-hosters who need custom values should
# build locally via docker-compose as documented in README.md.

on:
  push:
    tags:
      - 'v*.*.*'

# Default for anything not overriding it; the job below widens only what it needs.
permissions:
  contents: read

jobs:
  docker:
    name: Build & push termi-${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images + cosign signatures to ghcr.io
      id-token: write # OIDC token for keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - image: gateway
            context: apps/gateway
            dockerfile: apps/gateway/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            shuvoo/termi-${{ matrix.image }}:latest
            shuvoo/termi-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/shuv-o/termi-${{ matrix.image }}:latest
            ghcr.io/shuv-o/termi-${{ matrix.image }}:${{ steps.version.outputs.version }}

      # Sign by digest (never by tag, which is mutable). Both registries hold
      # the same manifest list, so one digest covers all four tags.
      - name: Sign images with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: termi-${{ matrix.image }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push-action returned no digest; refusing to sign."
            exit 1
          fi
          cosign sign --yes "shuvoo/${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/shuv-o/${IMAGE}@${DIGEST}"
