# useful commands:
#   docker compose -f docker-compose.local.yml build
#   docker compose -f docker-compose.local.yml up
#
# If node_modules seem stale/wrong, force-reinitialise:
#   docker volume rm termix_node_modules && docker compose -f docker-compose.local.yml up

services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: termix-guacd
    restart: unless-stopped
    networks:
      - termix-network

  postgres:
    image: postgres:17-alpine
    container_name: termix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-termi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-termi}
      POSTGRES_DB: ${POSTGRES_DB:-termi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - termix-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-termi}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ensures the shared node_modules volume contains Linux-compiled packages from
  # the deps image. Mounts at /vol (not /app/node_modules) so the image's own
  # /app/node_modules is untouched and can be copied into the volume when stale.
  init-modules:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: termix-init-modules
    restart: "no"
    volumes:
      - node_modules:/vol
    command: ["sh", "-c", "test -f /vol/.bin/prisma && echo 'node_modules OK' || (echo 'Copying Linux node_modules into volume...' && cp -a /app/node_modules/. /vol/)"]

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: termix-migrate
    working_dir: /app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      init-modules:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-termi}:${POSTGRES_PASSWORD:-termi}@postgres:5432/${POSTGRES_DB:-termi}
    command: ["sh", "-c", "cd apps/web && ../../node_modules/.bin/prisma generate && ../../node_modules/.bin/prisma migrate deploy"]
    networks:
      - termix-network

  gateway:
    # Reuse the deps stage — has all workspace deps compiled for Linux.
    # Source is mounted at runtime so tsx watch picks up changes instantly.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: termix-gateway
    working_dir: /app
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      init-modules:
        condition: service_completed_successfully
    volumes:
      - .:/app                              # live source code
      - node_modules:/app/node_modules      # Linux-compiled node_modules (not host macOS ones)
    ports:
      - "22081:22081"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:22080,http://127.0.0.1:22080,http://localhost:22081}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:22080}
      GATEWAY_PORT: 22081
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET must be set (openssl rand -base64 32)}
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-true}
      NODE_ENV: development
    command: npm run dev:gateway
    networks:
      - termix-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: termix-web
    working_dir: /app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    volumes:
      - .:/app                              # live source code
      - node_modules:/app/node_modules      # shared with gateway — same Linux node_modules
    ports:
      - "22080:22080"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:22080,http://127.0.0.1:22080}
      # In dev mode the gateway is directly reachable on :22081 — no Traefik needed.
      # Hardcoded (not from .env) because Docker Compose expands .env before applying
      # defaults, so ${VAR:-default} would silently pick up the production value.
      NEXT_PUBLIC_GATEWAY_URL: ws://localhost:22081
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:22080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-termi}:${POSTGRES_PASSWORD:-termi}@postgres:5432/${POSTGRES_DB:-termi}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
      # Internal: web server reaches gateway directly over the Docker network
      GATEWAY_URL: ws://gateway:22081
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-true}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
    command: npm run dev
    networks:
      - termix-network

volumes:
  postgres_data:
  # Shared Linux-compiled node_modules for web, gateway, and migrate containers.
  # Populated by init-modules on startup; delete to force reinit: docker volume rm termix_node_modules
  node_modules:

networks:
  termix-network:
    driver: bridge
